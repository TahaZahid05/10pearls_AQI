name: Daily Training & Model Registry Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  train-and-register:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train, Evaluate, and Register Model to DagsHub MLflow
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
          MLFLOW_TRACKING_USERNAME: ${{ github.repository_owner }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          python -m src.train

      - name: Commit and push retrained model artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.pkl plots/shap_summary.png
          git commit -m "Auto-update retrained model artifact and SHAP plot [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload SHAP Plot Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shap-feature-importance
          path: plots/shap_summary.png
          if-no-files-found: ignore
