name: Daily Training & Model Registry Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  train-and-register:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train, Evaluate, and Register Model to DagsHub MLflow
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          python -m src.train

      - name: Upload SHAP Plot Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shap-feature-importance
          path: plots/shap_summary.png
          if-no-files-found: ignore
